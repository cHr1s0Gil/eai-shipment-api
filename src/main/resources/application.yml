spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: java-eai-shipment

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

    consumer:
      group-id: eai-shipment-api
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.trusted.packages]": com.eaishipment.shipment.event

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:eai_shipment}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      "[hibernate.format_sql]": true

security:
  api-key:
    header-name: x-api-key
    value: ${EAI_API_KEY:local-dev-api-key}

server:
  port: 8080

springdoc:
  swagger-ui:
    path: /swagger-ui.html

shipment:
  dispatch:
    scheduler:
      cron: 
        default: "0 */5 * * * *"
    timeout-minutes: 10

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: when-authorized

analysis:
  openai:
    enabled: ${OPENAI_ANALYSIS_ENABLED:false}
    model: ${OPENAI_MODEL:gpt-5.6-luna}